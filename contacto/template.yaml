AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Formulario de contacto → correo por SES. Una Lambda chica con Function URL que se sirve
  como `/api/contacto` (o la ruta que use el sitio) detrás de la CloudFront de estatico/template.yaml.

# Seguridad:
# - Solo acepta pedidos que traen el header `x-origen` con el secreto que CloudFront agrega
#   (ApiSecreto, el mismo valor en los dos stacks). Llamar la Function URL directo da 403, así
#   que nadie se salta el rate limit falsificando `cloudfront-viewer-address`.
# - Rate limit por IP real (`cloudfront-viewer-address`) en memoria del contenedor, igual que en
#   Vercel; la concurrencia reservada (2) pone un techo duro de envíos por segundo.
# - Todo campo del formulario se escapa antes de ir al HTML del correo.
# - Envía por SES con el rol de la Lambda: no hay clave que guardar ni rotar.

Parameters:
  Proyecto:
    Type: String
  IdentidadSes:
    Type: String
    Description: Dominio verificado en SES (us-east-1) desde el que se envía (ej. lanelectric.cl o afachile.cl).
  Remitente:
    Type: String
    Description: 'From del correo, de ese dominio (ej. "Lan Electric Web <web@lanelectric.cl>").'
  Destino:
    Type: String
    Description: Correo(s) que reciben los mensajes, separados por coma.
  Asunto:
    Type: String
    Default: Nuevo mensaje desde la web
  CamposRequeridos:
    Type: String
    Default: name,email,message
    Description: Campos obligatorios, separados por coma.
  ApiSecreto:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: El mismo valor que ApiSecreto del stack estático.

Resources:
  Rol:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - { Key: proyecto, Value: !Ref Proyecto }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Solo puede enviar desde su identidad: un bug no manda correo "como" otro proyecto.
        - PolicyName: ses
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${IdentidadSes}'

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}'
      RetentionInDays: 14
      Tags:
        - { Key: proyecto, Value: !Ref Proyecto }

  Funcion:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: Formulario de contacto → SES.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt Rol.Arn
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Tags:
        - { Key: proyecto, Value: !Ref Proyecto }
      Environment:
        Variables:
          DESTINO: !Ref Destino
          REMITENTE: !Ref Remitente
          ASUNTO: !Ref Asunto
          REQUERIDOS: !Ref CamposRequeridos
          API_SECRETO: !Ref ApiSecreto
      Code:
        ZipFile: |
          const { SESv2Client, SendEmailCommand } = require('@aws-sdk/client-sesv2');
          const ses = new SESv2Client({});
          const E = process.env;
          const vistos = new Map();
          const json = (s, b) => ({ statusCode: s, headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
          const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
          function limitado(ip) {
            const ahora = Date.now();
            const t = (vistos.get(ip) || []).filter((x) => ahora - x < 60000);
            if (t.length >= 3) return true;
            t.push(ahora); vistos.set(ip, t);
            if (vistos.size > 5000) vistos.clear();
            return false;
          }
          exports.handler = async (ev) => {
            const h = ev.headers || {};
            if (!E.API_SECRETO || h['x-origen'] !== E.API_SECRETO) return json(403, { error: 'Prohibido.' });
            if (ev.requestContext?.http?.method !== 'POST') return json(405, { error: 'Método no permitido.' });
            const ip = (h['cloudfront-viewer-address'] || '').replace(/:\d+$/, '') || 'sin-ip';
            if (limitado(ip)) return json(429, { error: 'Demasiadas solicitudes. Intenta en 1 minuto.' });
            let d;
            try {
              const raw = ev.isBase64Encoded ? Buffer.from(ev.body || '', 'base64').toString() : ev.body || '';
              if (raw.length > 20000) return json(413, { error: 'Mensaje demasiado largo.' });
              d = JSON.parse(raw);
            } catch { return json(400, { error: 'JSON inválido.' }); }
            if (!d || typeof d !== 'object') return json(400, { error: 'JSON inválido.' });
            if (d._honeypot) return json(200, { success: true });
            for (const c of E.REQUERIDOS.split(',')) if (!String(d[c.trim()] ?? '').trim()) return json(400, { error: 'Campos requeridos faltantes.' });
            const email = String(d.email || '');
            if (email && !/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(email)) return json(400, { error: 'Correo inválido.' });
            const filas = Object.entries(d).filter(([k, v]) => k !== '_honeypot' && v !== '' && v != null)
              .map(([k, v]) => `<tr><td style="padding:8px;font-weight:bold">${esc(k)}</td><td style="padding:8px">${esc(v)}</td></tr>`).join('');
            try {
              const asunto = `${E.ASUNTO}${d.name ? ' - ' + String(d.name).slice(0, 80) : ''}`.replace(/[\r\n]/g, ' ');
              await ses.send(new SendEmailCommand({
                FromEmailAddress: E.REMITENTE,
                Destination: { ToAddresses: E.DESTINO.split(',').map((x) => x.trim()) },
                ReplyToAddresses: email ? [email] : undefined,
                Content: { Simple: {
                  Subject: { Data: asunto, Charset: 'UTF-8' },
                  Body: { Html: { Data: `<h2>${esc(E.ASUNTO)}</h2><table style="border-collapse:collapse;width:100%">${filas}</table>`, Charset: 'UTF-8' } },
                } },
              }));
              return json(200, { success: true });
            } catch (e) { console.error(e); return json(500, { error: 'Error interno del servidor.' }); }
          };

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Funcion
      AuthType: NONE

  PermisoUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # Desde oct-2025 una Function URL pública exige también lambda:InvokeFunction (sin él, 403).
  PermisoInvocar:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  ApiHost:
    Description: Va como ApiOrigen del stack estático.
    Value: !Select [2, !Split ['/', !GetAtt Url.FunctionUrl]]
